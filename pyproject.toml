[build-system]
requires = ["setuptools>=77"]   # 77+ reads the SPDX `license` string below (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "phd_project"
version = "0.1.0"
description = "PhD research package"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"

[tool.setuptools]
packages = ["phd_project"]     # ← Tell setuptools the ONLY package
include-package-data = true
