proc_data:
  root: "data_processed"
  site_selection: "data_processed/01_site_selection"
  site_hazard: "data_processed/03_site_hazard"
  # Site hazard curves written by nb 004 (flat: hcs[site_id]["AvgSA"][stat] -> (n_iml, 2),
  # col 0 = IML [g], col 1 = MAFE). One file per (IM, truncation level).
  AvgSA_03_hazard_curves_3sig: "data_processed/03_site_hazard/AvgSA_03_hazard_curves_60sites_3sig.pickle"
  AvgSA_03_hazard_curves_4sig: "data_processed/03_site_hazard/AvgSA_03_hazard_curves_60sites_4sig.pickle"
  AvgSA_03_hazard_curves_5sig: "data_processed/03_site_hazard/AvgSA_03_hazard_curves_60sites_5sig.pickle"
  AvgSA_06_hazard_curves_3sig: "data_processed/03_site_hazard/AvgSA_06_hazard_curves_60sites_3sig.pickle"
  AvgSA_06_hazard_curves_4sig: "data_processed/03_site_hazard/AvgSA_06_hazard_curves_60sites_4sig.pickle"
  AvgSA_06_hazard_curves_5sig: "data_processed/03_site_hazard/AvgSA_06_hazard_curves_60sites_5sig.pickle"
  # Multi-period SA/PGA hazard from nb 005 (calc SA_psha_eps4, 4-sigma truncation).
  # _curves:   nb 004's flat shape, hcs[site_id][imt][stat] -> (n_iml, 2); col 0 = IML [g], col 1 = MAFE.
  # _surfaces: {"imls", "periods", "imts", "sites"}; sites[site_id][stat] -> (n_iml, n_period) of MAFE,
  #            rows = imls, cols = periods (PGA carried as period 0.0). Assumes one IML grid shared by
  #            every IMT - true for this calculation, asserted in nb 005, not guaranteed in general.
  SA_hazard_curves_4sig: "data_processed/03_site_hazard/SA_hazard_curves_60sites_4sig.pickle"
  SA_hazard_surfaces_4sig: "data_processed/03_site_hazard/SA_hazard_surfaces_60sites_4sig.pickle"
  # AvgSA03 hazard curve fits
  AvgSA_03_fo_hc_fits: "data_processed/03_site_hazard/AvgSA_03_hazard_fit_first_order_60sites_4sig.csv"
  AvgSA_03_so_hc_fits: "data_processed/03_site_hazard/AvgSA_03_hazard_fit_second_order_60sites_4sig.csv"
  # Target IMLs for the iml-based disaggregation, chosen in notebook 017.
  # The AvgSA 0-6 file does not exist yet; notebook 020 skips any IM whose file
  # is missing rather than failing.
  disagg_imls_AvgSA_03: "data_processed/03_site_hazard/AvgSA_03_imls_for_disaggregation.csv"
  disagg_imls_AvgSA_06: "data_processed/03_site_hazard/AvgSA_06_imls_for_disaggregation.csv"
  # Disagg inputs to record selection: the 4-sigma-truncation ("sig4") IML-based set from nb 021
  # Per-site disagg shards from nb 021: <dir>/site_NNN.pickle + _index.json. Sharded
  # so a stripe's fingerprint names only its OWN site (see scripts/disagg_shards.py)
  # -- re-running the disagg for one site no longer invalidates all ~450 stripes.
  AvgSA_03_disagg_data_shards:        "data_processed/03_site_hazard/AvgSA_03_disagg_data_wp1sites_eps4"
  AvgSA_03_disagg_stats_gm_selection: "data_processed/03_site_hazard/AvgSA_03_disagg_stats_wp1sites_eps4.pickle"
  AvgSA_06_disagg_data_gm_selection:  "data_processed/03_site_hazard/AvgSA_06_disagg_data_wp1sites_eps4.pickle"
  AvgSA_06_disagg_stats_gm_selection: "data_processed/03_site_hazard/AvgSA_06_disagg_stats_wp1sites_eps4.pickle"
  # Per-site IML subset for which GCIM distributions / record ensembles are built (nb 031-036)
  AvgSA_03_imls_for_selection: "data_processed/05_gcim_distributions/imls_for_selection_AvgSA_03.json"
  AvgSA_06_imls_for_selection: "data_processed/05_gcim_distributions/imls_for_selection_AvgSA_06.json"
  # Stripe-coverage remediation from nb 060: reserve stripes that can be run against the
  # record ensembles already selected, and the additional IMLs that need a fresh
  # disaggregation. Both are folded back into the IML lists by nb 017.
  AvgSA_03_reserve_stripes: "data_processed/05_gcim_distributions/reserve_stripes_to_run_AvgSA_03.json"
  AvgSA_03_additional_imls: "data_processed/05_gcim_distributions/additional_imls_for_disagg_AvgSA_03.json"
  corr_model: "data_processed/02_im_correlation_model"
  gm_databases_for_selection: "data_processed/04_gm_database_for_selection"
  gm_database: "data_processed/04_gm_database_for_selection/ESM-NGAsub_combined.csv"
  gcim_dists: "data_processed/05_gcim_distributions"
  gm_selection: "data_processed/06_gm_selection"
  gm_records: "data_processed/07_gm_records"
  # Building Datasets
  dc2_casestudy_dataset: "data_processed/08_casestudy_structure_datasets/ec8_gen2_dc2_cbfs.pickle"
  dc2_scA_reference_dataset: "data_processed/08_casestudy_structure_datasets/ec8_gen2_dc2_scA_reference_cbfs.pickle"
  site_specific_dataset: "data_processed/08_casestudy_structure_datasets/ec8_gen2_site_specific_cbfs.pickle"
  # Sites sharing a byte-identical structural design (nb 051) - one IDA per group
  unique_structural_designs: "data_processed/08_casestudy_structure_datasets/unique_structural_designs.json"
  unique_structural_designs_csv: "data_processed/08_casestudy_structure_datasets/unique_structural_designs.csv"
  # Fragility Curves
  ec8_gen2_scA_fragility_curves: data_processed/09_structure_fragility_curves/ec8_gen2_scA_reference
  dc2_scA_reference_collapse_fc_summary: data_processed/09_structure_fragility_curves/ec8_gen2_scA_reference/dc2_scA_collapsefragility_summary.csv
  # Site case-study converted fragilities (nb 014, and nb 053 which fans the
  # per-design-group conversion back out into exactly these per-site files)
  wp1_sites_fragility_curves: data_processed/09_structure_fragility_curves/wp1_casestudy_sites
  wp1_sites_femap695_fc_summary: data_processed/09_structure_fragility_curves/wp1_casestudy_sites/site_femap695_collapsefragility_summary.csv
  # Per-design-group converted fragilities (nb 053) - the artefact the per-site files
  # above are copied from, one folder per group_{n}s_{gid}.
  wp1_groups_fragility_curves: data_processed/09_structure_fragility_curves/wp1_design_groups
  wp1_groups_femap695_fc_summary: data_processed/09_structure_fragility_curves/wp1_design_groups/group_femap695_collapsefragility_summary.csv
  # Per-record collapse capacities the fragilities above are fitted from (nb 053),
  # one CSV per IM: this stem + _{im}, a group x record table in units of g.
  wp1_groups_femap695_collapse_imls: data_processed/09_structure_fragility_curves/wp1_design_groups/group_femap695_collapse_imls.csv
  # Per-design-group MSA-FEMAP695 fragilities (nb 061) - collected from the group MSA
  # runs and fanned back out into the per-site files above.
  wp1_groups_msa_femap695_fc_summary: data_processed/09_structure_fragility_curves/wp1_design_groups/group_msa_femap695_collapsefragility_summary.csv
  wp1_sites_msa_femap695_fc_summary: data_processed/09_structure_fragility_curves/wp1_casestudy_sites/site_msa_femap695_collapsefragility_summary.csv
  # Per-record collapse outcomes behind the MSA fragilities (nb 061): a
  # (group, stripe_iml) x record table of 0/1 flags, one CSV per IM - this stem plus
  # _{im}, exactly as for the IDA collapse IMLs above.
  wp1_groups_msa_femap695_collapse_flags: data_processed/09_structure_fragility_curves/wp1_design_groups/group_msa_femap695_collapse_flags.csv
  # Extra MSA-FEMAP695 stripes nb 061 asks for, one row per (group, tail); read back
  # by nb 054, which adds exactly these to each group's stripe list.
  wp1_groups_msa_femap695_additional_stripes: data_processed/09_structure_fragility_curves/wp1_design_groups/group_msa_femap695_additional_stripes.csv
  # boostrapping stuff
  bootstrapping: data_processed/10_fragility_curve_statistical_analysis/bootstrapping
  # SDOF stuff is kinda of irrelevant now. It will probably crash
  sdof_fitting: "C:/Users/clemettn/Documents/phd/data_processed/09_sdof_fitting"
  sdof_parameters: "C:/Users/clemettn/Documents/phd/data_processed/09_sdof_fitting/sdof_parameters"
  sdof_optimisation: "C:/Users/clemettn/Documents/phd/data_processed/09_sdof_fitting/optimisation_results" 
  sdof_fragility_curves: data_processed/09_sdof_fitting/fragility_curves
  
  approx_sdof_systems: "C:/Users/clemettn/Documents/phd/data_processed/09_sdof_fitting/approx_sdof_systems"
  site_specific_sdofs: "data_processed/10_site_specific_sdofs"
  site_specific_3s_mdof_mechanisms: "data_processed/10_site_specific_sdofs/3s_mdof_mechanisms.json"

