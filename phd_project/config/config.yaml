proc_data:
  root: "data_processed"
  site_selection: "data_processed/01_site_selection"
  site_hazard: "data_processed/03_site_hazard"
  # Site hazard curves written by nb 004 (flat: hcs[site_id]["AvgSA"][stat] -> (n_iml, 2),
  # col 0 = IML [g], col 1 = MAFE). One file per (IM, truncation level).
  AvgSA_03_hazard_curves_3sig: "data_processed/03_site_hazard/AvgSA_03_hazard_curves_60sites_3sig.pickle"
  AvgSA_03_hazard_curves_4sig: "data_processed/03_site_hazard/AvgSA_03_hazard_curves_60sites_4sig.pickle"
  AvgSA_03_hazard_curves_5sig: "data_processed/03_site_hazard/AvgSA_03_hazard_curves_60sites_5sig.pickle"
  AvgSA_06_hazard_curves_3sig: "data_processed/03_site_hazard/AvgSA_06_hazard_curves_60sites_3sig.pickle"
  AvgSA_06_hazard_curves_4sig: "data_processed/03_site_hazard/AvgSA_06_hazard_curves_60sites_4sig.pickle"
  AvgSA_06_hazard_curves_5sig: "data_processed/03_site_hazard/AvgSA_06_hazard_curves_60sites_5sig.pickle"
  # Multi-period SA/PGA hazard from nb 005 (calc SA_psha_eps4, 4-sigma truncation).
  # _curves:   nb 004's flat shape, hcs[site_id][imt][stat] -> (n_iml, 2); col 0 = IML [g], col 1 = MAFE.
  # _surfaces: {"imls", "periods", "imts", "sites"}; sites[site_id][stat] -> (n_iml, n_period) of MAFE,
  #            rows = imls, cols = periods (PGA carried as period 0.0). Assumes one IML grid shared by
  #            every IMT - true for this calculation, asserted in nb 005, not guaranteed in general.
  SA_hazard_curves_4sig: "data_processed/03_site_hazard/SA_hazard_curves_60sites_4sig.pickle"
  SA_hazard_surfaces_4sig: "data_processed/03_site_hazard/SA_hazard_surfaces_60sites_4sig.pickle"
  # AvgSA03 hazard curve fits
  AvgSA_03_fo_hc_fits: "data_processed/03_site_hazard/AvgSA_03_hazard_fit_first_order_60sites_4sig.csv"
  AvgSA_03_so_hc_fits: "data_processed/03_site_hazard/AvgSA_03_hazard_fit_second_order_60sites_4sig.csv"
  # Target IMLs for the iml-based disaggregation, chosen in notebook 017.
  # The AvgSA 0-6 file does not exist yet; notebook 020 skips any IM whose file
  # is missing rather than failing.
  disagg_imls_AvgSA_03: "data_processed/03_site_hazard/AvgSA_03_imls_for_disaggregation.csv"
  disagg_imls_AvgSA_06: "data_processed/03_site_hazard/AvgSA_06_imls_for_disaggregation.csv"
  # Disagg inputs to record selection: the 4-sigma-truncation ("sig4") IML-based set from nb 021
