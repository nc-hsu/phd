  #   fx/{fx_id}/design_groups/group_{n}s_{gg}/   per-group IDA / MSA-FX fragilities (053, 061)
  #   fx/{fx_id}/design_groups/group_*_summary / _collapse_imls_{IM} / _collapse_flags_{IM}
