# =====================================================================================
# RECORD SETS - which ground-motion record sets exist, and which pairings are studied.
# =====================================================================================
# This section is NOT a list of paths: config.py leaves it as plain strings (every other
# section has its strings turned into absolute Paths). Use the helpers in config.py
# (study(), ss_dir(), fx_dir(), study_dir(), run-folder names) rather than reading it by hand.
#
# Three kinds of thing depend on record sets, and each gets its own folder level at every
# pipeline stage where it applies (06, 09, 10, 11, 12, 13 in data_processed; 04, 05, 06 in
# results; the run folders on the analysis drive):
#
#   ss/{ss_id}/        depends on ONE site-specific (SS) set   - selection, MSA-SS, SS bootstrap
#   fx/{fx_id}/        depends on ONE fixed (FX) set           - IDA-FX, MSA-FX, FX bootstrap, A2
#   studies/{study}/   depends on one SS set AND one FX set    - nb 072 dataset, A0/A1/A3 fits
#
# Naming: SS ids carry the IM, because the records are selected FOR that IM
# ("{IM}__{scheme}"); FX ids do not, because a fixed set is the same records whatever the IM
# - IM-specific FX products carry the IM in their own name (e.g. msa_AvgSA_03__femap695).
# A study is "{ss_id}__vs__{fx_id}". The double underscore separates the parts of every id,
# so an id whose own name contains single underscores (opt_ks_mu_sigma) still reads cleanly.
record_sets:
  # The study the main-line notebooks work on. Side-quest notebooks never read this: they
  # name their record sets explicitly, so changing it cannot change their results.
  active_study: "AvgSA_03__opt_ks_mu_sigma__vs__femap695"

  # Site-specific sets: GCIM-based selection per (site, stripe IML).
  #   scheme       the selection-config constant in
  #                scripts/WP1_ground_motion_set/setup_AvgSA03_gm_selection.py
  #   stripe_grid  which (site, IML) stripes the set is selected for:
  #                "live"  - proc_data.AvgSA_03_imls_for_selection, which nb 017 extends
  #                          with nb 060's remediation IMLs (the main line);
  #                an ss id - the FROZEN copy kept in that set's 06_gm_selection folder
  #                          (imls_for_selection_{im}.json), so re-running the set's
  #                          notebooks can never add stripes to it.
  #   stripe_grid_base  (live sets only, optional) the set whose stripes this one was
  #                started from. The live grid is rebuilt by nb 017 every run, so it must
  #                keep folding in the remediation IMLs nb 060 found for the base set too -
  #                otherwise re-running nb 017 would drop those stripes from the grid and
  #                nb 033 would prune them. nb 050 likewise runs the reserve stripes 060
  #                flagged for the base set (config.stripe_lineage).
  # (The MSA run folder names on the analysis drive follow from the id, see
  #  config.ss_msa_names.)
  ss:
    AvgSA_03__ks:
      im: "AvgSA_03"
      scheme: "SELECTION_CONFIG"
      stripe_grid: "AvgSA_03__ks"
      description: "Original selection: SSE record picking, KS acceptance test. Frozen (side quest nb 034); its MSA-SS was run on the analysis machine."
    AvgSA_03__opt_ks:
      im: "AvgSA_03"
      scheme: "SELECTION_CONFIG_OPTIMISED"
      stripe_grid: "AvgSA_03__ks"
      description: "Every stripe optimised against the weighted-KS objective. Side quest only (no MSA)."
    AvgSA_03__opt_mu_sigma:
      im: "AvgSA_03"
      scheme: "SELECTION_CONFIG_MU_SIGMA"
      stripe_grid: "AvgSA_03__ks"
      description: "Optimised against the set moments (mean, SD) of ln IM; KS not required. Side quest only (no MSA)."
    AvgSA_03__opt_ks_mu_sigma:
      im: "AvgSA_03"
      scheme: "SELECTION_CONFIG_KS_MU_SIGMA"
      stripe_grid: "live"
      stripe_grid_base: "AvgSA_03__ks"
      description: "Weighted KS + moments objective, KS required. The main-line SS set."

  # Fixed sets: the same records at every stripe and for every design group.
  #   The id (letters and digits only, no "_") names every FX folder AND the arm tokens in
  #   the processed file names: msa_{fx}, ida_{fx}, ida_{fx}_ub, ida_{fx}_avg
  #   (e.g. ..._ida_femap695_collapsefragility_AvgSA_03.json, ida_femap695_bootstrap_...).
  #   records:                   folder name under raw_data.fixed_record_sets (in-repo copy)
  #   records_analysis_machine:  where the run configs on the analysis machine read the JSONs
  #   record_glob:               the set's record JSONs within those folders. A record's
  #                              position in the SORTED listing is its record tag ("0", "1",
  #                              ...), which the IDA / MSA runs and the bootstrap key on.
  #   label:                     how figures name the set ("MSA FEMA P695", ...)
  fx:
    femap695:
      records: "femap695"
      records_analysis_machine: "D:/gm_records_p695"
      record_glob: "fema_p695_*.json"
      label: "FEMA P695"
      description: "FEMA P695 far-field set, 22 records."

  # Pairings. Every main-line stage from nb 072 on works on one of these.
  studies:
    AvgSA_03__ks__vs__femap695:
      ss: "AvgSA_03__ks"
      fx: "femap695"
    AvgSA_03__opt_ks_mu_sigma__vs__femap695:
      ss: "AvgSA_03__opt_ks_mu_sigma"
      fx: "femap695"

